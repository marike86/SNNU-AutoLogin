name: Windows build

on:
  push:
    branches: ['**']
    paths: &native-paths
      - 'src/**'
      - 'vendor/**'
      - 'Cargo.*'
      - 'build.rs'
      - '.cargo/**'
      - 'app.*'
      - 'icon.ico'
      - 'scripts/package.ps1'
      - 'scripts/third-party.ps1'
      - '.github/workflows/ci.yml'
  pull_request:
    paths: *native-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Test and package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: SNNU-AutoLogin-windows
          retention-days: 3
          path: dist/*
          if-no-files-found: error
