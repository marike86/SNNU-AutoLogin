name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sign_release:
        description: '使用已配置的正式发布密钥签名'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bash scripts/android-ci-setup.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build optimized test APK
        working-directory: android
        run: bash ./gradlew testDebugUnitTest lintDebug lintBenchmark assembleBenchmark assembleRelease --no-daemon
      - name: Check APK size
        run: |
          size=$(stat -c%s android/app/build/outputs/apk/benchmark/app-benchmark.apk)
          echo "Optimized test APK: $size bytes" >> "$GITHUB_STEP_SUMMARY"
          test "$size" -le 2097152
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SNNU-AutoLogin-android
          path: |
            android/app/build/outputs/apk/benchmark/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/reports/
            android/README.md
            android/VALIDATION.md
            LICENSE
          if-no-files-found: error

  # Emulator images are large and flaky on shared runners; run the matrix on demand.
  emulator:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [26, 31, 33, 34, 35, 36, 37]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bash scripts/android-ci-setup.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run device checks
        run: bash scripts/android-emulator-test.sh '${{ matrix.api }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-api-${{ matrix.api }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/device/

  signed-release:
    if: github.event_name == 'workflow_dispatch' && inputs.sign_release
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bash scripts/android-ci-setup.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Build with private release identity
        env:
          SNNU_KEYSTORE_BASE64: ${{ secrets.SNNU_KEYSTORE_BASE64 }}
          SNNU_STORE_PASSWORD: ${{ secrets.SNNU_STORE_PASSWORD }}
          SNNU_KEY_ALIAS: ${{ secrets.SNNU_KEY_ALIAS }}
          SNNU_KEY_PASSWORD: ${{ secrets.SNNU_KEY_PASSWORD }}
        run: |
          test -n "$SNNU_KEYSTORE_BASE64"
          export SNNU_KEYSTORE="$RUNNER_TEMP/snnu-release.jks"
          printf '%s' "$SNNU_KEYSTORE_BASE64" | base64 --decode > "$SNNU_KEYSTORE"
          cd android
          bash ./gradlew testDebugUnitTest lintRelease assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SNNU-AutoLogin-android-signed-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
